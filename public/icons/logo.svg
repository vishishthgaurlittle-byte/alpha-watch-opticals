<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8cf9a"/>
      <stop offset="0.5" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#8c6532"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13213a"/>
      <stop offset="1" stop-color="#0B1D33"/>
    </linearGradient>
  </defs>
  <!-- Outer bezel ring -->
  <circle cx="100" cy="100" r="94" fill="url(#navy)" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- Watch crown at top forming letter A tip -->
  <g transform="translate(100,22)">
    <rect x="-7" y="-3" width="14" height="18" rx="3" fill="url(#gold)"/>
    <circle cx="0" cy="-6" r="6" fill="none" stroke="url(#gold)" stroke-width="3"/>
  </g>

  <!-- Letter A: left & right legs -->
  <path d="M60 150 L94 34" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 150 L106 34" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>

  <!-- Optical lens as the crossbar -->
  <circle cx="100" cy="96" r="32" fill="rgba(198,161,91,0.12)" stroke="url(#gold)" stroke-width="5"/>

  <!-- Watch dial inside the lens -->
  <g transform="translate(100,96)">
    <circle cx="0" cy="0" r="25" fill="#0B1D33" stroke="#C6A15B" stroke-width="1"/>
    <line x1="0" y1="0" x2="-12" y2="-6" stroke="#F5F0E6" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="9" y2="-14" stroke="#C6A15B" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.8" fill="#C6A15B"/>
    <circle cx="-14" cy="-9" r="0.8" fill="#F5F0E6"/>
    <circle cx="0" cy="-16" r="0.8" fill="#F5F0E6"/>
    <circle cx="14" cy="-9" r="0.8" fill="#F5F0E6"/>
    <circle cx="14" cy="9" r="0.8" fill="#F5F0E6"/>
    <circle cx="0" cy="16" r="0.8" fill="#F5F0E6"/>
    <circle cx="-14" cy="9" r="0.8" fill="#F5F0E6"/>
  </g>
</svg>
